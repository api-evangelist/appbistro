name: AppBistro
description: AppBistro, operated by MMTG Labs, was an application marketplace for the Facebook Pages
  platform that let brands and page administrators discover, install, and manage third-party apps to
  boost engagement and reach on their fan pages. It also built AppGalleries, a white-label app-store
  platform. A TechCrunch Disrupt 2010 finalist, the San Francisco startup raised a $550K convertible
  note (Sand Hill Angels, 500 Startups, i/o Ventures, Zelkova Ventures, Seraph Group, and angels
  including Alfred Lin) and was acquired by mobile ad network InMobi on 2012-07-13, after which the
  product and its five-person team (co-founders Ryan Merket and Nalin Mittal) wound down. The company
  is defunct and appbistro.com no longer resolves; no live API, developer portal, or documentation
  surface exists to enrich.
